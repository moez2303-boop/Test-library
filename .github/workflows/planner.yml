name: Build planner

on:
  workflow_dispatch:
    inputs:
      year:
        description: Planner year
        default: "2027"
  push:
    paths:
      - planner/**
      - .github/workflows/planner.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-crosextra-caladea fonts-crosextra-carlito
          pip install reportlab pypdf pypdfium2 pillow

      - name: Generate
        working-directory: planner
        run: python3 generate.py --year "${{ inputs.year || '2027' }}"

      - name: Verify links and pages
        working-directory: planner
        run: python3 verify.py dist/*.pdf

      - name: Listing images
        working-directory: planner
        run: python3 mockups.py

      - uses: actions/upload-artifact@v4
        with:
          name: calm-planner-${{ inputs.year || '2027' }}
          path: |
            planner/dist/*.zip
            planner/dist/listing/*.png
          retention-days: 90
